name: emokhtar
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  intl_phone_field: ^3.2.0
  image_picker: ^1.0.4
  scanbot_sdk: ^2.2.0
  url_launcher: ^6.1.7
  google_maps_flutter: ^2.2.0
  geolocator: ^9.0.2
  http: ^0.13.5
  webview_flutter: ^4.4.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/AppIcons/AppiconWL.png"
  adaptive_icon_foreground: "assets/AppIcons/Appicon192.png"
  adaptive_icon_background: "#FFFFFF"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/profile_photo.jpg
    - assets/flag.png
    - assets/phone_input_background.jpg

  fonts:
    - family: assets/fonts/Tajawal-Regular.ttf
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 700